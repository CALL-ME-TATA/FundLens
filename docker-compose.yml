services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fundlens
      POSTGRES_PASSWORD: fundlens
      POSTGRES_DB: fundlens
    ports: ["5432:5432"]
    volumes:
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
